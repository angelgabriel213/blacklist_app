name: Pruebas de Integración

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

defaults:
  run:
    working-directory: blacklist_app

jobs:
  pruebas_integracion:
    name: Pruebas de Integración (Newman)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout de repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js (para Newman)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Crear archivo .env para CI
        run: |
          echo "DATABASE_URL=postgresql://postgres:postgres@db:5432/blacklist_db" > .env
          echo "BEARER_TOKEN=test123" >> .env
          echo "POSTGRES_USER=postgres" >> .env
          echo "POSTGRES_PASSWORD=postgres" >> .env
          echo "POSTGRES_DB=blacklist_db" >> .env
          echo "Archivo .env generado:"
          cat .env

      - name: Levantar servicios con Docker Compose
        run: |
          docker compose up -d --build
          echo "Esperando a que Docker Compose inicialice los servicios..."
          sleep 5
          docker compose ps

      - name: Esperar a que el servicio esté listo (Health Check)
        run: |
          echo "Iniciando health check de la API..."
          max_attempts=20
          attempt=1
          while [ $attempt -le $max_attempts ]; do
            echo "Intento $attempt de $max_attempts..."
            if curl -s -f http://localhost:5001/blacklists/ping > /dev/null 2>&1; then
              echo " ¡Servicio listo después de $attempt intentos!"
              curl http://localhost:5001/blacklists/ping
              exit 0
            fi
            echo " Servicio no disponible aún. Esperando 3 segundos..."
            sleep 3
            attempt=$((attempt + 1))
          done
          echo " ERROR: El servicio no respondió después de $max_attempts intentos"
          echo "=== Logs de la aplicación ==="
          docker compose logs app
          echo "============================="
          exit 1

      - name: Instalar Newman
        run: npm install -g newman

      - name: Ejecutar colección de Postman
        run: |
          # El archivo está en la carpeta postman/ en la raíz del repo
          cd ..
          newman run "postman/postman_collection" \
            --env-var "base_url=http://localhost:5001" \
            --env-var "bearer_token=test123" \
            --env-var "test_email=ci-integration-test@example.com" \
            --env-var "app_uuid=123e4567-e89b-12d3-a456-426614174000"
