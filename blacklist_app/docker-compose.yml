services:
  app:
    build:
      context: .
      platforms:
        - linux/amd64
    ports:
      - "5001:8080"
    depends_on:
      - db
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-blacklist_db}
      BEARER_TOKEN: ${BEARER_TOKEN}

  db:
    image: postgres:14
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-blacklist_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
